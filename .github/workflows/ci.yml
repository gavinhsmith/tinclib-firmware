name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - run: pip install platformio

      - name: Native tests
        run: pio test -e native

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fuzz dispatcher
        run: |
          mkdir -p build
          clang -g -O1 -fsanitize=fuzzer,address,undefined -fno-sanitize-recover=all \
            -Iexternal/tinclib-protocol -Ilib/tinc_core -Itest \
            -o build/fuzz_dispatch test/fuzz/fuzz_dispatch.c lib/tinc_core/*.c
          ./build/fuzz_dispatch -max_total_time=60

      - name: Fuzz frame parser (tinclib-protocol's target)
        working-directory: external/tinclib-protocol
        run: |
          mkdir -p build
          clang -g -fsanitize=fuzzer,address -o build/fuzz_frame tests/fuzz_frame.c crc16.c tinc_frame.c
          ./build/fuzz_frame -max_total_time=30

  build:
    runs-on: ${{ matrix.os }}
    needs: [test, fuzz]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # one entry per platforms/<target>/ (and per OS for the PC target)
        include:
          - { target: esp8266, os: ubuntu-latest, out: firmware.bin, asset: tinclib-firmware-esp8266.bin }
          - { target: pc, os: ubuntu-latest, out: program, asset: tinclib-pc-linux-x64 }
          - { target: pc, os: macos-latest, out: program, asset: tinclib-pc-macos-arm64 }
          - { target: pc, os: windows-latest, out: program.exe, asset: tinclib-pc-windows-x64.exe }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('platformio.ini') }}

      - run: pip install platformio

      - name: Build
        run: |
          pio run -e ${{ matrix.target }}
          cp .pio/build/${{ matrix.target }}/${{ matrix.out }} ${{ matrix.asset }}

      # the PC target end to end: a pty plays the calculator, a local HTTP server the internet
      - name: End-to-end test
        if: matrix.target == 'pc' && runner.os != 'Windows'
        run: python test/pc/e2e.py ./${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        # whichever job gets here first creates the release; all upload to it
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --generate-notes ||
            gh release view "$GITHUB_REF_NAME" >/dev/null
          gh release upload "$GITHUB_REF_NAME" ${{ matrix.asset }} --clobber
