; tinclib-firmware. Protocol sources come from the pinned submodule in
; external/tinclib-protocol (built via lib/core/proto.c, never copied).

[env]
build_flags = -I external/tinclib-protocol

[env:esp12e]
platform = espressif8266@4.2.1
board = esp12e
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
build_flags = ${env.build_flags} -Wall

[env:native]
platform = native
build_src_filter = -<*>
build_flags = ${env.build_flags} -std=c99 -Wall -Wextra -Werror
