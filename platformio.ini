; tinclib-firmware: one shared core (lib/tinc_core) plus a platform layer
; per chip (platforms/<chip>/). Protocol sources come from the pinned
; submodule in external/tinclib-protocol (built via lib/tinc_core/proto.c).
;
; Adding a chip: create platforms/<chip>/ implementing tinc_platform.h and
; add an [env:<chip>] with build_src_filter = +<<chip>/>.

[platformio]
src_dir = platforms
default_envs = esp8266

[env]
build_flags = -I external/tinclib-protocol

[env:esp8266]
platform = espressif8266@4.2.1
board = esp12e
framework = arduino
build_src_filter = +<esp8266/>
board_build.filesystem = littlefs
monitor_speed = 115200
build_flags = ${env.build_flags} -Wall

[env:native]
platform = native
build_src_filter = -<*>
build_flags = ${env.build_flags} -std=c99 -Wall -Wextra -Werror
