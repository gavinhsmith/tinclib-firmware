; tinclib-firmware: one shared core (lib/tinc_core) plus a platform layer
; per target (platforms/<target>/). Protocol sources come from the pinned
; submodule in external/tinclib-protocol (built via lib/tinc_core/proto.c).
;
; Adding a target: create platforms/<target>/ implementing tinc_platform.h
; and add an [env:<target>] with build_src_filter = +<<target>/>.

[platformio]
src_dir = platforms
default_envs = esp8266

[env]
build_flags = -I external/tinclib-protocol

[env:esp8266]
platform = espressif8266@4.2.1
board = esp12e
framework = arduino
build_src_filter = +<esp8266/>
board_build.filesystem = littlefs
monitor_speed = 115200
build_flags = ${env.build_flags} -Wall -D TINC_SLOT_COUNT=5

; The firmware as a desktop app: the calculator plugs into the PC over USB
; and this answers it using the PC's network. Binary: .pio/build/pc/program[.exe]
[env:pc]
platform = native
build_src_filter = +<pc/>
build_flags = ${env.build_flags} -std=gnu99 -Wall -Wextra -D TINC_SLOT_COUNT=1
extra_scripts = platforms/pc/libs.py

[env:native]
platform = native
build_src_filter = -<*>
build_flags = ${env.build_flags} -std=c99 -Wall -Wextra -Werror
